# Nginx 設定 —— 前端容器
#
# 三個責任：
#   1. 提供 Vue 建置後的靜態檔
#   2. 把 /api/* 反向代理到後端容器
#   3. 把 /hub/* 升級為 WebSocket 給 SignalR 用
#
# 因為瀏覽器看到的全部來自同一個 origin（localhost:80），
# 正式環境完全不需要 CORS 設定 —— 那只在開發時前後端分屬不同 port 才需要。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ====== 1. SPA 路由 ======
    #
    # 依序尋找：實際檔案 → 實際目錄 → 退回 index.html
    # 最後那個 fallback 讓前端路由（若之後導入 vue-router）能正常運作，
    # 否則直接輸入網址會得到 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== 2. API 反向代理 ======
    #
    # "api" 是 docker-compose.yml 裡的服務名稱，
    # Docker 內建 DNS 會把它解析成該容器的位址。
    location /api/ {
        proxy_pass http://api:8080/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上傳影像可能較大，放寬限制
        client_max_body_size 20m;

        # 推論可能要一兩秒，逾時設寬鬆一點
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ====== 3. SignalR 的 WebSocket 升級 ======
    #
    # 🔴 這一段是最容易漏掉的。
    #    少了 proxy_http_version 1.1 與 Upgrade / Connection 標頭，
    #    SignalR 會連不上，或靜靜退回長輪詢 —— 功能看起來正常但失去即時性。
    #
    #    前端刻意設定 skipNegotiation: true 且指定 WebSocket，
    #    就是為了讓這種設定錯誤直接報錯而不是默默降級。
    location /hub/ {
        proxy_pass http://api:8080/hub/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # WebSocket 是長連線，逾時要拉長，否則會被反覆斷線重連
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ====== 4. 靜態資源快取 ======
    #
    # Vite 產出的 .js/.css 檔名帶 hash（例如 index-C6AWwexI.js），
    # 內容一變檔名就變，所以舊檔名的內容永遠不變 —— 可以放心長期快取。
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 的檔名固定，而它引用的正是那些帶 hash 的檔案。
    # 它若被快取，改版後使用者會一直拿到舊版 —— 所以絕對不能快取。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ====== 5. 其他 ======
    server_tokens off;          # 不顯示 Nginx 版本

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json image/svg+xml;
}
