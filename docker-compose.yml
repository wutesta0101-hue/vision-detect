# 正式部署設定 —— 四個容器
#
#   vd_frontend  Nginx：提供 Vue 靜態檔 + 反向代理 /api 與 /hub
#   vd_api       ASP.NET Core：業務層、作業佇列、SignalR
#   vd_model     FastAPI：無狀態推論服務
#   vd_postgres  PostgreSQL：資料持久化
#
# 對外只發布一個 port（80）。API、模型服務、資料庫都只在內部網路可達。
#
# 常用指令：
#   docker compose build      建置映像
#   docker compose up -d      啟動
#   docker compose ps         查看狀態
#   docker compose logs -f    看即時日誌
#   docker compose down       停止（保留資料）
#   docker compose down -v    停止並清除資料（⚠️ 資料會消失）
#
# 環境變數由專案根目錄的 .env 提供（compose 會自動讀取）。

services:
  # ========================================================
  # 資料庫
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: vd_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdpassword}
      POSTGRES_DB: ${POSTGRES_DB:-vision_detect}

    volumes:
      - pg_data:/var/lib/postgresql/data

    # 讓 Docker 知道服務「真的能用了」，不只是「程序啟動了」。
    # api 靠這個判斷何時可以啟動。
    #
    # 用 pg_isready 而非 curl —— postgres 的 alpine 映像沒有 curl，
    # 而 pg_isready 是 PostgreSQL 自帶的連線測試工具。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vduser} -d ${POSTGRES_DB:-vision_detect}"]
      interval: 5s
      timeout: 3s
      retries: 5

    # 正式環境不對外開放 5432。開發用的 override 檔會加上。

  # ========================================================
  # Python 推論服務
  # ========================================================
  model:
    build:
      context: ./model-service
    image: vd-model:latest
    container_name: vd_model
    restart: unless-stopped

    environment:
      MODEL_VERSION: ${MODEL_VERSION:-yolov8n-coco}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.25}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-1}

    # 健康檢查寫在 model-service/Dockerfile 裡，這裡不需要重複定義

    # 自訂權重可掛在這裡並覆寫 MODEL_WEIGHTS，換模型不用重建映像
    # volumes:
    #   - ./model-service/weights:/app/weights:ro

    # 對外不可達 —— 只有 api 容器會呼叫它

  # ========================================================
  # C# 業務層
  # ========================================================
  api:
    build:
      context: ./backend
    image: vd-api:latest
    container_name: vd_api
    restart: unless-stopped

    environment:
      # 容器間用服務名稱互相定址，不是 localhost
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vision_detect};Username=${POSTGRES_USER:-vduser};Password=${POSTGRES_PASSWORD:-vdpassword}"
      ModelService__BaseUrl: "http://model:8000"
      Storage__ImagePath: "/app/images"
      ASPNETCORE_ENVIRONMENT: Production

    volumes:
      - images:/app/images

    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy

    # curl 由 backend/Dockerfile 額外安裝 —— 
    # ASP.NET runtime 映像既沒有 curl 也沒有 wget。
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

    # 對外不可達 —— 只有 frontend 的 Nginx 會代理到它

  # ========================================================
  # 前端（Nginx）
  # ========================================================
  frontend:
    build:
      context: ./frontend
    image: vd-frontend:latest
    container_name: vd_frontend
    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-80}:80"

    depends_on:
      - api

  # ========================================================
  # 資料庫管理介面
  # ========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vd_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT:-8080}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

# ============================================================
# 具名 volume —— 資料存在容器之外，容器刪掉資料還在
# ============================================================
volumes:
  pg_data:
  pgadmin_data:
  images:
